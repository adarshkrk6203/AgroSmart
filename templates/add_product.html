{% extends "base.html" %}
{% block content %}

<div class="fade-up">

    <div class="glass-card p-4 mx-auto" style="max-width:500px;">

        <h2 class="text-center mb-3">Add Product 🛒</h2>
        <p class="text-center muted mb-4">List your crop in marketplace</p>

        <form method="POST" enctype="multipart/form-data">

            <input name="name" class="input-premium w-100 mb-3" placeholder="Product Name" required>

            <textarea name="description" class="input-premium w-100 mb-3" placeholder="Description"></textarea>

            <input name="price" type="number" step="0.01" class="input-premium w-100 mb-3" placeholder="Price">

            <input name="quantity" type="number" class="input-premium w-100 mb-3" placeholder="Quantity">

            <input name="unit" class="input-premium w-100 mb-3" placeholder="kg / dozen">

            <input name="category" class="input-premium w-100 mb-3" placeholder="Category">

            <input type="file" name="image" class="input-premium w-100 mb-3">

            <button class="btn-premium w-100">Add Product</button>

        </form>

    </div>

</div>

{% endblock %}
